<!-- Outreach HTML card template. -->

<div style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">

    <div style="background-color: rgb(255, 255, 255); border-radius: 8px; padding: 24px; color: rgb(26, 26, 26); border: 1px solid #e5e7eb;">

      <p style="font-size: 14px; line-height: 1.6; margin: 0 0 12px 0;">
        {{GREETING_LINE_HTML}}
      </p>

      <p style="font-size: 14px; line-height: 1.6; margin: 0 0 16px 0;">
        {{INTRO_LINE_HTML}}
      </p>

      <div style="margin-bottom: 16px;">
        {{RECENT_SIGNALS_HTML}}
      </div>

      <p style="font-size: 14px; line-height: 1.6; margin: 0 0 16px 0;">
        {{POST_CARDS_LINE_HTML}}
      </p>

      <p style="font-size: 14px; line-height: 1.6; margin: 0 0 24px 0;">
        {{TRIAL_LINE_HTML}}
      </p>

      <p style="font-size: 14px; margin: 0 0 2px 0; color: rgb(26, 26, 26);">Chase Chevalier</p>
      <p style="font-size: 13px; margin: 0 0 16px 0; color: rgb(26, 26, 26);">MicroFlowOps &middot;
        <a href="{{MICROFLOWOPS_URL}}" style="color: rgb(26, 26, 26); text-decoration: none;" target="_blank" rel="noopener noreferrer">microflowops.com</a>
      </p>

      <p style="font-size: 12px; color: rgb(102, 102, 102); margin: 0 0 12px 0;">Informational only; not legal advice.</p>

    </div>

    <div style="padding: 16px 24px; text-align: center;">
      <p style="font-size: 12px; color: rgb(102, 102, 102); margin: 0;">{{MAILING_ADDRESS}}</p>
      <p style="font-size: 12px; color: rgb(136, 136, 136); margin: 6px 0 0 0;">
        <a href="{{UNSUBSCRIBE_URL}}" style="color: rgb(136, 136, 136); text-decoration: underline;" target="_blank" rel="noopener noreferrer">Unsubscribe</a>
      </p>
    </div>

  </div>
</div>
