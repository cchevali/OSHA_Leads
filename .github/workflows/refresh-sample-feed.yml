name: Refresh Public Sample Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-public-sample-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh sample feed JSON
        shell: pwsh
        run: |
          $sampleDir = Join-Path $env:RUNNER_TEMP "sample_feed"
          New-Item -ItemType Directory -Force -Path $sampleDir | Out-Null
          $dbPath = Join-Path $sampleDir "osha_sample.sqlite"

          python ingest_osha.py `
            --db $dbPath `
            --since-days 7 `
            --states TX,CA,FL,GA,IL,NC,OH,PA `
            --max-details 500

          python scripts\export_sample_feed.py `
            --db $dbPath `
            --out web\app\sample\sample_signals.json

      - name: Commit sample JSON if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- web/app/sample/sample_signals.json) {
            Write-Host "No sample feed changes."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/app/sample/sample_signals.json
          git commit -m "chore(sample): refresh public sample feed"
          git push
